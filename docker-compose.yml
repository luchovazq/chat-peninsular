services:
  postgres:
    image: postgres:16-alpine
    container_name: chat-peninsular-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: chatpeninsula
      POSTGRES_PASSWORD: password
      POSTGRES_DB: chatpeninsula
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
